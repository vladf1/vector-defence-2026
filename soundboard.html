<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Vector Defence Soundboard</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10151c;
        color: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 20% 0%, rgba(50, 127, 116, 0.22), transparent 30rem),
          linear-gradient(135deg, #111820 0%, #20262d 48%, #171b21 100%);
      }

      main {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0 40px;
      }

      header {
        margin-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.6rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px;
      }

      button {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 12px;
        min-height: 70px;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        color: #f9fbff;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09);
        cursor: pointer;
        font: inherit;
        text-align: left;
      }

      button:hover {
        border-color: rgba(94, 216, 186, 0.55);
        background: rgba(94, 216, 186, 0.16);
      }

      button:focus-visible {
        outline: 3px solid rgba(94, 216, 186, 0.72);
        outline-offset: 2px;
      }

      button.playing {
        border-color: rgba(255, 212, 94, 0.72);
        background: rgba(255, 212, 94, 0.18);
      }

      .label {
        overflow-wrap: anywhere;
        font-size: 1.03rem;
        font-weight: 800;
      }

      .play-icon {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 50%;
        color: #10151c;
        background: #5ed8ba;
        font-size: 0.9rem;
        font-weight: 900;
      }

      .status {
        min-height: 1.4em;
        margin-top: 18px;
        color: rgba(244, 247, 251, 0.75);
        font-weight: 700;
      }

      audio {
        display: none;
      }

    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Soundboard</h1>
      </header>

      <section class="board" aria-label="Game sound effects"></section>

      <p class="status" role="status" aria-live="polite"></p>
    </main>

    <audio id="build-mode-cancel" data-label="Build Mode Cancel" preload="auto" src="./src/assets/audio/build-mode-cancel.m4a"></audio>
    <audio id="build-mode-on" data-label="Build Mode On" preload="auto" src="./src/assets/audio/build-mode-on.m4a"></audio>
    <audio id="campaign-complete" data-label="Campaign Complete" preload="auto" src="./src/assets/audio/campaign-complete.m4a"></audio>
    <audio id="escape-burst" data-label="Escape Burst" preload="auto" src="./src/assets/audio/escape-burst.m4a"></audio>
    <audio id="gun-fire" data-label="Gun Fire" preload="auto" src="./src/assets/audio/gun-fire.m4a"></audio>
    <audio id="invalid-action" data-label="Invalid Action" preload="auto" src="./src/assets/audio/invalid-action.m4a"></audio>
    <audio id="laser-fire" data-label="Laser Fire" preload="auto" src="./src/assets/audio/laser-fire.m4a"></audio>
    <audio id="laser-lock-off" data-label="Laser Lock Off" preload="auto" src="./src/assets/audio/laser-lock-off.m4a"></audio>
    <audio id="laser-lock-on" data-label="Laser Lock On" preload="auto" src="./src/assets/audio/laser-lock-on.m4a"></audio>
    <audio id="level-loss" data-label="Level Loss" preload="auto" src="./src/assets/audio/level-loss.m4a"></audio>
    <audio id="level-start" data-label="Level Start" preload="auto" src="./src/assets/audio/level-start.m4a"></audio>
    <audio id="level-win" data-label="Level Win" preload="auto" src="./src/assets/audio/level-win.m4a"></audio>
    <audio id="menu-open" data-label="Menu Open" preload="auto" src="./src/assets/audio/menu-open.m4a"></audio>
    <audio id="missile-explosion" data-label="Missile Explosion" preload="auto" src="./src/assets/audio/missile-explosion.m4a"></audio>
    <audio id="missile-launch" data-label="Missile Launch" preload="auto" src="./src/assets/audio/missile-launch.m4a"></audio>
    <audio id="monster-heavy-death" data-label="Monster Heavy Death" preload="auto" src="./src/assets/audio/monster-heavy-death.m4a"></audio>
    <audio id="monster-pop" data-label="Monster Pop" preload="auto" src="./src/assets/audio/monster-pop.m4a"></audio>
    <audio id="monster-shatter" data-label="Monster Shatter" preload="auto" src="./src/assets/audio/monster-shatter.m4a"></audio>
    <audio id="pause" data-label="Pause" preload="auto" src="./src/assets/audio/pause.m4a"></audio>
    <audio id="projectile-impact" data-label="Projectile Impact" preload="auto" src="./src/assets/audio/projectile-impact.m4a"></audio>
    <audio id="resume" data-label="Resume" preload="auto" src="./src/assets/audio/resume.m4a"></audio>
    <audio id="slow-pulse" data-label="Slow Pulse" preload="auto" src="./src/assets/audio/slow-pulse.m4a"></audio>
    <audio id="sound-toggle" data-label="Sound Toggle" preload="auto" src="./src/assets/audio/sound-toggle.m4a"></audio>
    <audio id="splitter-burst" data-label="Splitter Burst" preload="auto" src="./src/assets/audio/splitter-burst.m4a"></audio>
    <audio id="tower-place" data-label="Tower Place" preload="auto" src="./src/assets/audio/tower-place.m4a"></audio>
    <audio id="tower-select" data-label="Tower Select" preload="auto" src="./src/assets/audio/tower-select.m4a"></audio>
    <audio id="tower-sell" data-label="Tower Sell" preload="auto" src="./src/assets/audio/tower-sell.m4a"></audio>
    <audio id="tower-upgrade" data-label="Tower Upgrade" preload="auto" src="./src/assets/audio/tower-upgrade.m4a"></audio>
    <audio id="ui-click" data-label="UI Click" preload="auto" src="./src/assets/audio/ui-click.m4a"></audio>
    <audio id="ui-confirm" data-label="UI Confirm" preload="auto" src="./src/assets/audio/ui-confirm.m4a"></audio>
    <audio id="wave-clear" data-label="Wave Clear" preload="auto" src="./src/assets/audio/wave-clear.m4a"></audio>
    <audio id="wave-start" data-label="Wave Start" preload="auto" src="./src/assets/audio/wave-start.m4a"></audio>

    <script>
      const board = document.querySelector(".board");
      const audioElements = Array.from(document.querySelectorAll("audio"));
      const status = document.querySelector(".status");
      const audioVersion = Date.now().toString(36);
      let activeButton;

      for (const audio of audioElements) {
        const sourceUrl = new URL(audio.getAttribute("src"), document.baseURI);
        sourceUrl.searchParams.set("v", audioVersion);
        audio.src = sourceUrl.href;
      }

      for (const audio of audioElements) {
        const button = document.createElement("button");
        const label = document.createElement("span");
        const icon = document.createElement("span");

        button.type = "button";
        button.dataset.audioId = audio.id;
        label.className = "label";
        label.textContent = audio.dataset.label;
        icon.className = "play-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = "▶";

        button.append(label, icon);
        board.append(button);
      }

      function setStatus(message) {
        status.textContent = message;
      }

      function resetActiveButton() {
        if (activeButton) {
          activeButton.classList.remove("playing");
          activeButton = undefined;
        }
      }

      for (const button of document.querySelectorAll("[data-audio-id]")) {
        const audio = document.getElementById(button.dataset.audioId);
        const label = audio.dataset.label;

        audio.addEventListener("ended", resetActiveButton);
        audio.addEventListener("error", () => {
          setStatus(`Could not load ${label}.`);
          resetActiveButton();
        });

        button.addEventListener("click", async () => {
          resetActiveButton();
          for (const otherAudio of audioElements) {
            if (otherAudio !== audio) {
              otherAudio.pause();
              otherAudio.currentTime = 0;
            }
          }

          audio.currentTime = 0;
          activeButton = button;
          button.classList.add("playing");
          setStatus(`Playing ${label}`);

          try {
            await audio.play();
          } catch {
            setStatus(`Browser blocked ${label}. Try the button again.`);
            resetActiveButton();
          }
        });
      }
    </script>
  </body>
</html>
