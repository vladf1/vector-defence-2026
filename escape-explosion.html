<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escape Explosion Lab</title>
    <style>
      :root {
        color-scheme: dark;
        background: #020807;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 960px;
        min-height: 640px;
        overflow: hidden;
        background: linear-gradient(135deg, #020807 0%, #07100e 56%, #030605 100%);
        color: rgba(232, 255, 248, 0.9);
        font-family: "Avenir Next", Avenir, Inter, ui-sans-serif, system-ui, sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .hud {
        position: fixed;
        top: 22px;
        left: 28px;
        display: flex;
        align-items: baseline;
        gap: 12px;
        pointer-events: none;
      }

      .hud strong {
        color: #f4fff8;
        font-size: 24px;
        line-height: 1;
        text-transform: uppercase;
      }

      .hud span {
        color: rgba(255, 228, 148, 0.86);
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .controls {
        position: fixed;
        top: 22px;
        right: 28px;
        display: grid;
        grid-template-columns: repeat(2, minmax(180px, max-content));
        gap: 10px 18px;
        align-items: center;
        padding: 14px;
        border: 1px solid rgba(232, 255, 248, 0.18);
        border-radius: 8px;
        background: rgba(2, 8, 7, 0.76);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(12px);
      }

      .control {
        display: grid;
        grid-template-columns: 84px 132px 46px;
        gap: 8px;
        align-items: center;
        color: rgba(232, 255, 248, 0.74);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .control input {
        width: 132px;
        accent-color: #ffe494;
      }

      .value {
        color: rgba(255, 228, 148, 0.92);
        text-align: right;
      }

      .actions {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
      }

      button {
        appearance: none;
        min-width: 82px;
        min-height: 36px;
        border: 1px solid rgba(232, 255, 248, 0.24);
        border-radius: 6px;
        background: rgba(4, 15, 12, 0.9);
        color: rgba(232, 255, 248, 0.84);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      button:hover,
      button:focus-visible {
        border-color: rgba(255, 228, 148, 0.64);
        color: #fff4bc;
        outline: none;
      }

      button[aria-pressed="true"] {
        background: rgba(255, 228, 148, 0.16);
        color: #fff4bc;
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <strong>Escape Explosion</strong>
      <span id="particle-readout"></span>
    </div>
    <div class="controls">
      <label class="control" for="large-fragments">
        <span>Shards</span>
        <input id="large-fragments" type="range" min="0" max="120" step="1" value="58" />
        <span id="large-fragments-value" class="value">58</span>
      </label>
      <label class="control" for="small-fragments">
        <span>Flecks</span>
        <input id="small-fragments" type="range" min="0" max="120" step="1" value="30" />
        <span id="small-fragments-value" class="value">30</span>
      </label>
      <label class="control" for="smoke-count">
        <span>Smoke</span>
        <input id="smoke-count" type="range" min="0" max="50" step="1" value="18" />
        <span id="smoke-count-value" class="value">18</span>
      </label>
      <label class="control" for="burst-speed">
        <span>Speed</span>
        <input id="burst-speed" type="range" min="0.35" max="1.8" step="0.05" value="1" />
        <span id="burst-speed-value" class="value">1.0x</span>
      </label>
      <label class="control" for="time-scale">
        <span>Time</span>
        <input id="time-scale" type="range" min="0.1" max="1.4" step="0.05" value="1" />
        <span id="time-scale-value" class="value">1.0x</span>
      </label>
      <label class="control" for="zoom-scale">
        <span>Zoom</span>
        <input id="zoom-scale" type="range" min="0.65" max="2.3" step="0.05" value="1" />
        <span id="zoom-scale-value" class="value">1.0x</span>
      </label>
      <div class="actions">
        <button id="trigger-burst" type="button">Burst</button>
        <button id="auto-repeat" type="button" aria-pressed="false">Auto</button>
        <button id="reset-defaults" type="button">Reset</button>
        <button id="clear-bursts" type="button">Clear</button>
      </div>
    </div>
    <canvas id="escape-explosion-testing" aria-label="Escape explosion lab"></canvas>
    <script type="module" src="/src/escape-explosion-testing.ts"></script>
  </body>
</html>
