<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Slow Motion</title>
    <style>
      :root {
        color-scheme: dark;
        background: #020807;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 960px;
        min-height: 640px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 50%, rgba(54, 255, 205, 0.08), transparent 28rem),
          linear-gradient(135deg, #020807 0%, #07100e 52%, #030605 100%);
        font-family: "Avenir Next", Avenir, Inter, ui-sans-serif, system-ui, sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .slowmo-hud {
        position: fixed;
        top: 28px;
        left: 32px;
        display: flex;
        align-items: baseline;
        gap: 12px;
        color: rgba(232, 255, 248, 0.9);
        font-size: 22px;
        font-weight: 800;
        line-height: 1;
        pointer-events: none;
      }

      .phase-name {
        color: rgba(255, 228, 148, 0.86);
        font-size: 13px;
        text-transform: uppercase;
      }

      .playback-controls {
        position: fixed;
        top: 24px;
        right: 28px;
        display: flex;
        align-items: center;
        gap: 14px;
        color: rgba(232, 255, 248, 0.76);
        font-size: 13px;
        font-weight: 800;
      }

      .playback-toggle {
        appearance: none;
        min-width: 76px;
        border: 1px solid rgba(232, 255, 248, 0.28);
        border-radius: 6px;
        padding: 8px 13px;
        background: rgba(2, 8, 7, 0.72);
        color: rgba(255, 228, 148, 0.9);
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 800;
      }

      .playback-toggle:hover,
      .playback-toggle:focus-visible {
        border-color: rgba(255, 228, 148, 0.64);
        color: #fff4bc;
      }

      .speed-control {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 210px;
      }

      .speed-control input {
        width: 128px;
        accent-color: #ffe494;
      }

      .speed-value {
        min-width: 34px;
        color: rgba(255, 228, 148, 0.9);
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="slowmo-hud">
      <span id="monster-name"></span>
      <span id="phase-name" class="phase-name"></span>
    </div>
    <div class="playback-controls">
      <label class="speed-control" for="speed-slider">
        <span>Speed</span>
        <input id="speed-slider" type="range" min="0.1" max="2" step="0.05" value="1" />
        <span id="speed-value" class="speed-value">1.0x</span>
      </label>
      <button id="playback-toggle" class="playback-toggle" type="button">Pause</button>
    </div>
    <canvas id="monster-slowmo" aria-label="Monster slow motion showcase"></canvas>
    <script type="module" src="/src/monster-slowmo.ts"></script>
  </body>
</html>
