<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Slow Motion</title>
    <style>
      :root {
        color-scheme: dark;
        background: #020807;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 960px;
        min-height: 640px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 50%, rgba(54, 255, 205, 0.08), transparent 28rem),
          linear-gradient(135deg, #020807 0%, #07100e 52%, #030605 100%);
        font-family: "Avenir Next", Avenir, Inter, ui-sans-serif, system-ui, sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .slowmo-hud {
        position: fixed;
        top: 24px;
        left: 32px;
        display: flex;
        align-items: baseline;
        gap: 12px;
        max-width: 360px;
        color: rgba(232, 255, 248, 0.9);
        font-size: 22px;
        font-weight: 800;
        line-height: 1;
        pointer-events: none;
      }

      .phase-name {
        color: rgba(255, 228, 148, 0.86);
        font-size: 13px;
        text-transform: uppercase;
      }

      .playback-controls {
        position: fixed;
        top: 24px;
        right: 28px;
        width: min(760px, calc(100vw - 332px));
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        color: rgba(232, 255, 248, 0.76);
        font-size: 13px;
        font-weight: 800;
      }

      .slider-controls,
      .button-controls {
        align-items: center;
      }

      .slider-controls {
        display: grid;
        grid-template-columns: repeat(3, max-content);
        justify-content: end;
        gap: 18px;
        width: 100%;
        max-width: 760px;
      }

      .button-controls {
        display: flex;
        position: fixed;
        top: 88px;
        left: 32px;
        gap: 10px;
      }

      .playback-button {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 58px;
        height: 40px;
        border: 1px solid rgba(232, 255, 248, 0.28);
        border-radius: 6px;
        padding: 0 0 2px;
        background: rgba(2, 8, 7, 0.72);
        color: rgba(255, 228, 148, 0.9);
        cursor: pointer;
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Avenir Next", Avenir, Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 22px;
        line-height: 1;
      }

      .playback-button:hover,
      .playback-button:focus-visible {
        border-color: rgba(255, 228, 148, 0.64);
        color: #fff4bc;
      }

      .speed-control {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 9px;
        min-width: 190px;
      }

      .speed-control input {
        width: 104px;
        accent-color: #ffe494;
      }

      .speed-value {
        min-width: 34px;
        color: rgba(255, 228, 148, 0.9);
        text-align: right;
      }

      @media (max-width: 1120px) {
        .slider-controls {
          grid-template-columns: max-content;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="slowmo-hud">
      <span id="monster-name"></span>
      <span id="phase-name" class="phase-name"></span>
    </div>
    <div class="playback-controls">
      <div class="slider-controls">
        <label class="speed-control" for="approach-speed-slider">
          <span>Approach</span>
          <input id="approach-speed-slider" type="range" min="0.1" max="3" step="0.05" value="1" />
          <span id="approach-speed-value" class="speed-value">1.0x</span>
        </label>
        <label class="speed-control" for="explosion-speed-slider">
          <span>Explosion</span>
          <input id="explosion-speed-slider" type="range" min="0.1" max="2" step="0.05" value="1" />
          <span id="explosion-speed-value" class="speed-value">1.0x</span>
        </label>
        <label class="speed-control" for="zoom-slider">
          <span>Zoom</span>
          <input id="zoom-slider" type="range" min="0.1" max="1.75" step="0.05" value="1" />
          <span id="zoom-value" class="speed-value">1.0x</span>
        </label>
      </div>
      <div class="button-controls">
        <button id="repeat-monster" class="playback-button" type="button" aria-label="Repeat">🔁</button>
        <button id="next-monster" class="playback-button" type="button" aria-label="Next">⏭️</button>
        <button id="playback-toggle" class="playback-button" type="button" aria-label="Pause">⏸️</button>
      </div>
    </div>
    <canvas id="monster-slowmo" aria-label="Monster slow motion showcase"></canvas>
    <script type="module" src="/src/monster-slowmo.ts"></script>
  </body>
</html>
