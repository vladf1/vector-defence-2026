<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explosion Lab</title>
    <style>
      :root {
        color-scheme: dark;
        background: #020807;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 960px;
        min-height: 640px;
        overflow: hidden;
        background: linear-gradient(135deg, #020807 0%, #07100e 52%, #030605 100%);
        font-family: "Avenir Next", Avenir, Inter, ui-sans-serif, system-ui, sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .slowmo-hud {
        position: fixed;
        top: 24px;
        left: 32px;
        display: flex;
        align-items: baseline;
        gap: 12px;
        max-width: 360px;
        color: rgba(232, 255, 248, 0.9);
        font-size: 22px;
        font-weight: 800;
        line-height: 1;
        pointer-events: none;
      }

      .phase-name {
        color: rgba(255, 228, 148, 0.86);
        font-size: 13px;
        text-transform: uppercase;
      }

      .mode-switch {
        position: fixed;
        top: 82px;
        left: 32px;
        display: inline-grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        padding: 4px;
        border: 1px solid rgba(232, 255, 248, 0.2);
        border-radius: 6px;
        background: rgba(2, 8, 7, 0.7);
      }

      .mode-button {
        appearance: none;
        min-width: 82px;
        border: 0;
        border-radius: 4px;
        padding: 8px 12px;
        background: transparent;
        color: rgba(232, 255, 248, 0.68);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .mode-button[aria-pressed="true"] {
        background: rgba(255, 228, 148, 0.16);
        color: #fff4bc;
      }

      .mode-button:hover,
      .mode-button:focus-visible {
        color: #fff4bc;
      }

      .playback-controls {
        position: fixed;
        top: 24px;
        right: 28px;
        width: min(760px, calc(100vw - 332px));
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        color: rgba(232, 255, 248, 0.76);
        font-size: 13px;
        font-weight: 800;
      }

      .slider-controls,
      .button-controls {
        align-items: center;
      }

      .slider-controls {
        display: grid;
        grid-template-columns: repeat(3, max-content);
        justify-content: end;
        gap: 18px;
        width: 100%;
        max-width: 760px;
      }

      .button-controls {
        display: flex;
        position: fixed;
        top: 130px;
        left: 32px;
        gap: 10px;
      }

      .playback-button {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 58px;
        height: 40px;
        border: 1px solid rgba(232, 255, 248, 0.28);
        border-radius: 6px;
        padding: 0 0 2px;
        background: rgba(2, 8, 7, 0.72);
        color: rgba(255, 228, 148, 0.9);
        cursor: pointer;
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Avenir Next", Avenir, Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 22px;
        line-height: 1;
      }

      .playback-button:hover,
      .playback-button:focus-visible {
        border-color: rgba(255, 228, 148, 0.64);
        color: #fff4bc;
      }

      .speed-control {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 9px;
        min-width: 190px;
      }

      .speed-control input {
        width: 104px;
        accent-color: #ffe494;
      }

      .speed-value {
        min-width: 34px;
        color: rgba(255, 228, 148, 0.9);
        text-align: right;
      }

      .debug-home {
        position: fixed;
        z-index: 2;
        bottom: 24px;
        left: 32px;
        padding: 9px 12px;
        border: 1px solid rgba(232, 255, 248, 0.24);
        border-radius: 6px;
        background: rgba(2, 8, 7, 0.76);
        color: #9dffd7;
        font-size: 12px;
        font-weight: 800;
        text-decoration: none;
        text-transform: uppercase;
      }

      @media (max-width: 1120px) {
        .slider-controls {
          grid-template-columns: max-content;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="slowmo-hud">
      <span id="monster-name"></span>
      <span id="phase-name" class="phase-name"></span>
    </div>
    <div class="mode-switch" aria-label="Explosion lab mode">
      <button id="monster-mode" class="mode-button" type="button" aria-pressed="true">Monsters</button>
      <button id="missile-mode" class="mode-button" type="button" aria-pressed="false">Missile</button>
      <button id="combined-mode" class="mode-button" type="button" aria-pressed="false">Both</button>
    </div>
    <div class="playback-controls">
      <div class="slider-controls">
        <label class="speed-control" for="approach-speed-slider">
          <span>Approach</span>
          <input id="approach-speed-slider" type="range" min="0.1" max="3" step="0.05" value="1" />
          <span id="approach-speed-value" class="speed-value">1.0x</span>
        </label>
        <label class="speed-control" for="explosion-speed-slider">
          <span>Explosion</span>
          <input id="explosion-speed-slider" type="range" min="0.1" max="2" step="0.05" value="1" />
          <span id="explosion-speed-value" class="speed-value">1.0x</span>
        </label>
        <label class="speed-control" for="zoom-slider">
          <span>Zoom</span>
          <input id="zoom-slider" type="range" min="0.1" max="1.75" step="0.05" value="1" />
          <span id="zoom-value" class="speed-value">1.0x</span>
        </label>
      </div>
      <div class="button-controls">
        <button id="repeat-monster" class="playback-button" type="button" aria-label="Repeat">🔁</button>
        <button id="next-monster" class="playback-button" type="button" aria-label="Next">⏭️</button>
        <button id="playback-toggle" class="playback-button" type="button" aria-label="Pause">⏸️</button>
      </div>
    </div>
    <a class="debug-home" href="./index.html">Debug tools</a>
    <canvas id="explosion-testing" aria-label="Explosion lab showcase"></canvas>
    <script type="module" src="/src/explosion-testing.ts"></script>
  </body>
</html>
