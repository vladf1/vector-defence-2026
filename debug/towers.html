<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Vector Defence Tower Sheet</title>
    <style>
      :root {
        color-scheme: dark;
        background: #020807;
        color: #effff7;
        font-family: "Avenir Next", Avenir, Inter, ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #020807;
      }

      header {
        position: sticky;
        z-index: 1;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 16px max(20px, calc((100vw - 1320px) / 2));
        border-bottom: 1px solid rgba(232, 255, 248, 0.12);
        background: rgba(2, 8, 7, 0.92);
        backdrop-filter: blur(12px);
      }

      h1 {
        margin: 0;
        color: #effff7;
        font-size: clamp(1.25rem, 4vw, 2rem);
      }

      a {
        color: #9dffd7;
        font-weight: 800;
        text-decoration: none;
      }

      main {
        padding: 16px;
      }

      canvas {
        display: block;
        width: min(100%, 1270px);
        height: auto;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tower + Projectile Sheet</h1>
      <a href="./index.html">Debug tools</a>
    </header>
    <main>
      <canvas id="tower-testing" aria-label="Tower and projectile render sheet"></canvas>
    </main>
    <script type="module" src="/src/tower-testing.ts"></script>
  </body>
</html>
